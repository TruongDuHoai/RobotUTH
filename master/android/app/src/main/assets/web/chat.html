<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotuth v3 - Knowledge Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #E6F4F3;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: #FFFFFF;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #FFFFFF;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #E2E8F0;
        }

        .chat-header .bot-avatar {
            width: 120px;
            height: 48px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .chat-header .bot-avatar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #F8FAFC;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeInUp 0.3s ease;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.bot {
            align-self: flex-start;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 16px;
        }

        .message.user .message-avatar {
            background: #008689;
        }

        .message.bot .message-avatar {
            background: #E2E8F0;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #008689;
            color: #FFFFFF;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-content {
            background: #FFFFFF;
            color: #0F172A;
            border: 1px solid #E2E8F0;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            color: #94A3B8;
            margin-top: 4px;
            text-align: right;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #FFFFFF;
            border-radius: 18px;
            border: 1px solid #E2E8F0;
            width: fit-content;
            align-self: flex-start;
            margin-left: 48px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #94A3B8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .chat-input-container {
            padding: 16px 24px;
            background: #FFFFFF;
            border-top: 1px solid #E2E8F0;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #E2E8F0;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            resize: none;
            max-height: 120px;
            min-height: 44px;
            font-family: inherit;
            background: #F8FAFC;
            color: #0F172A;
            -webkit-appearance: none;
            appearance: none;
        }

        .chat-input:focus {
            border-color: #008689;
            background: #FFFFFF;
        }

        .chat-input::placeholder {
            color: #94A3B8;
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #008689;
            color: #FFFFFF;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
        }

        .keyboard-toggle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #E2E8F0;
            color: #475569;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .keyboard-toggle:hover {
            background: #CBD5E1;
        }

        .keyboard-toggle.active {
            background: #008689;
            color: #FFFFFF;
        }

        .keyboard-toggle svg {
            width: 20px;
            height: 20px;
        }

        .virtual-keyboard {
            background: #F1F5F9;
            border-top: 1px solid #E2E8F0;
            padding: 12px;
            display: block;
        }

        .virtual-keyboard.hidden {
            display: none;
        }

        .keyboard-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
            width: 100%;
        }

        .keyboard-row:last-child {
            margin-bottom: 0;
        }

        .key {
            flex: 1;
            height: 44px;
            border-radius: 8px;
            border: 1px solid #E2E8F0;
            background: #FFFFFF;
            color: #0F172A;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .key:hover {
            background: #F8FAFC;
        }

        .key:active {
            background: #008689;
            color: #FFFFFF;
            transform: scale(0.95);
        }

        .key.wide {
            flex: 1.5;
        }

        .key.extra-wide {
            flex: 2;
        }

        .key.space {
            flex: 4;
        }

        .key.special {
            background: #E2E8F0;
            color: #475569;
        }

        .key.special:active {
            background: #94A3B8;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94A3B8;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
            color: #64748B;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #475569;
        }


        @media (max-width: 640px) {
            body {
                background: #FFFFFF;
            }
            .chat-container {
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
            }
            .chat-input-container {
                padding-bottom: max(16px, env(safe-area-inset-bottom));
            }
            .key {
                height: 40px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="bot-avatar">
                <img src="logo.png" alt="Logo" />
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="empty-state" id="emptyState">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <h3>Bắt đầu trò chuyện</h3>
            </div>
        </div>

        <div class="chat-input-container">
            <textarea 
                class="chat-input" 
                id="chatInput" 
                placeholder="Nhập câu hỏi..."
                rows="1"
                maxlength="500"
            ></textarea>
            <button class="keyboard-toggle" id="keyboardToggle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                    <path d="M6 8h2"></path>
                    <path d="M10 8h2"></path>
                    <path d="M14 8h2"></path>
                    <path d="M18 8h0"></path>
                    <path d="M6 12h2"></path>
                    <path d="M10 12h2"></path>
                    <path d="M14 12h2"></path>
                    <path d="M18 12h0"></path>
                    <path d="M6 16h2"></path>
                    <path d="M10 16h2"></path>
                    <path d="M14 16h2"></path>
                </svg>
            </button>
            <button class="send-btn" id="sendBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>

        <div class="virtual-keyboard" id="virtualKeyboard">
            <div class="keyboard-row">
                <button class="key" data-key="q">Q</button>
                <button class="key" data-key="w">W</button>
                <button class="key" data-key="e">E</button>
                <button class="key" data-key="r">R</button>
                <button class="key" data-key="t">T</button>
                <button class="key" data-key="y">Y</button>
                <button class="key" data-key="u">U</button>
                <button class="key" data-key="i">I</button>
                <button class="key" data-key="o">O</button>
                <button class="key" data-key="p">P</button>
            </div>
            <div class="keyboard-row">
                <button class="key" data-key="a">A</button>
                <button class="key" data-key="s">S</button>
                <button class="key" data-key="d">D</button>
                <button class="key" data-key="f">F</button>
                <button class="key" data-key="g">G</button>
                <button class="key" data-key="h">H</button>
                <button class="key" data-key="j">J</button>
                <button class="key" data-key="k">K</button>
                <button class="key" data-key="l">L</button>
            </div>
            <div class="keyboard-row">
                <button class="key special wide" id="shiftKey">⇧</button>
                <button class="key" data-key="z">Z</button>
                <button class="key" data-key="x">X</button>
                <button class="key" data-key="c">C</button>
                <button class="key" data-key="v">V</button>
                <button class="key" data-key="b">B</button>
                <button class="key" data-key="n">N</button>
                <button class="key" data-key="m">M</button>
                <button class="key special" id="backspaceKey">⌫</button>
            </div>
            <div class="keyboard-row">
                <button class="key special" data-key="?">?</button>
                <button class="key special" data-key=",">,</button>
                <button class="key space" data-key=" ">SPACE</button>
                <button class="key special" data-key=".">.</button>
                <button class="key special" data-key="!">!</button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const keyboardToggle = document.getElementById('keyboardToggle');
        const virtualKeyboard = document.getElementById('virtualKeyboard');
        const shiftKey = document.getElementById('shiftKey');
        const backspaceKey = document.getElementById('backspaceKey');
        const emptyState = document.getElementById('emptyState');
        
        let isLoading = false;
        let isShiftActive = false;
        const urlParams = new URLSearchParams(window.location.search || '');
        const apiBaseUrlParam = urlParams.get('apiBaseUrl');
        const isFileOrigin = window.location.protocol === 'file:';
        const isLocalhost = window.location.hostname === 'localhost';
        const API_BASE_URL = apiBaseUrlParam
            ? apiBaseUrlParam
            : (isFileOrigin || isLocalhost ? 'http://10.0.2.2:8000' : window.location.origin);
        const DEFAULT_MODE = 'hybrid';

        // Keyboard toggle (keyboard shown by default, click to hide)
        keyboardToggle.classList.add('active');
        keyboardToggle.addEventListener('click', () => {
            virtualKeyboard.classList.toggle('hidden');
            keyboardToggle.classList.toggle('active');
        });

        // Virtual keyboard keys
        document.querySelectorAll('.key[data-key]').forEach(key => {
            key.addEventListener('click', () => {
                const keyValue = key.dataset.key;
                let charToInsert = keyValue;
                
                if (isShiftActive && keyValue.length === 1) {
                    charToInsert = keyValue.toUpperCase();
                    isShiftActive = false;
                    shiftKey.classList.remove('active');
                } else if (!isShiftActive && keyValue.length === 1) {
                    charToInsert = keyValue.toLowerCase();
                }
                
                insertAtCursor(charToInsert);
                chatInput.focus();
            });
        });

        // Shift key
        shiftKey.addEventListener('click', () => {
            isShiftActive = !isShiftActive;
            shiftKey.classList.toggle('active');
            updateKeyLabels();
        });

        // Backspace key
        backspaceKey.addEventListener('click', () => {
            deleteAtCursor();
            chatInput.focus();
        });

        function updateKeyLabels() {
            document.querySelectorAll('.key[data-key]').forEach(key => {
                const keyValue = key.dataset.key;
                if (keyValue.length === 1 && keyValue.match(/[a-z]/i)) {
                    key.textContent = isShiftActive ? keyValue.toUpperCase() : keyValue.toLowerCase();
                }
            });
        }

        function insertAtCursor(text) {
            const start = chatInput.selectionStart;
            const end = chatInput.selectionEnd;
            const value = chatInput.value;
            
            chatInput.value = value.substring(0, start) + text + value.substring(end);
            chatInput.selectionStart = chatInput.selectionEnd = start + text.length;
            chatInput.dispatchEvent(new Event('input'));
        }

        function deleteAtCursor() {
            const start = chatInput.selectionStart;
            const end = chatInput.selectionEnd;
            const value = chatInput.value;
            
            if (start === end && start > 0) {
                chatInput.value = value.substring(0, start - 1) + value.substring(end);
                chatInput.selectionStart = chatInput.selectionEnd = start - 1;
            } else if (start !== end) {
                chatInput.value = value.substring(0, start) + value.substring(end);
                chatInput.selectionStart = chatInput.selectionEnd = start;
            }
            chatInput.dispatchEvent(new Event('input'));
        }

        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
        });

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        function showError(msg) {
            console.error(msg);
        }

        function addMessage(text, isUser) {
            if (emptyState) emptyState.style.display = 'none';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = isUser ? '👤' : '🤖';
            
            const content = document.createElement('div');
            const contentInner = document.createElement('div');
            contentInner.className = 'message-content';
            contentInner.textContent = text;
            
            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
            
            content.appendChild(contentInner);
            content.appendChild(time);
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || isLoading) return;

            addMessage(text, true);
            chatInput.value = '';
            chatInput.style.height = 'auto';
            isLoading = true;
            sendBtn.disabled = true;
            showTyping();

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);
                
                const response = await fetch(`${API_BASE_URL}/api/chat/query?query=${encodeURIComponent(text)}&mode=${encodeURIComponent(DEFAULT_MODE)}`, {
                    method: 'POST',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                hideTyping();

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                
                if (data.success) {
                    addMessage(data.response || 'Không có phản hồi', false);
                } else {
                    addMessage(data.response || data.message || 'Có lỗi xảy ra', false);
                }

            } catch (error) {
                hideTyping();
                if (error.name === 'AbortError') {
                    showError(`Request timeout (10s). Server không phản hồi tại ${API_BASE_URL}`);
                } else {
                    showError(`Lỗi kết nối: ${error.message}. Đảm bảo server đang chạy tại ${API_BASE_URL}`);
                }
                addMessage('Xin lỗi, tôi không thể kết nối với server. Vui lòng thử lại sau.', false);
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                chatInput.focus();
            }
        }

        chatInput.focus();
    </script>
</body>
</html>
