# Robotuth v3 — single LAN gateway (nginx)
#
# One public door for the robot, the Android app and the admin hub. Replaces the
# old split of Tailscale Funnel -> robot-gateway :8010 (loopback) + server :8001
# + an in-app TailscaleWebGuardMiddleware.
#
# Run it (foreground, supervised by PM2) with a writable prefix so the relative
# paths below (pid/logs/temp) land in the repo's data/ dir and nothing has to be
# hardcoded to one machine:
#
#   mkdir -p data/nginx
#   nginx -p "$PWD/data/nginx" -c "$PWD/deploy/nginx.conf"
#
# start_system.sh does exactly this. Listening port: 10010 (see README).

worker_processes 1;
daemon off;
pid nginx.pid;
error_log error.log warn;

events {
    worker_connections 1024;
}

http {
    access_log access.log;

    # Temp dirs (relative to the -p prefix).
    client_body_temp_path client_body;
    proxy_temp_path       proxy;
    fastcgi_temp_path     fastcgi;
    uwsgi_temp_path       uwsgi;
    scgi_temp_path        scgi;

    upstream robotuth_server {
        server 127.0.0.1:8000;
    }

    server {
        listen 10010;
        server_name _;

        # --- API docs + health: reachable now (the funnel never allowed /docs) ---
        location = /docs         { proxy_pass http://robotuth_server; }
        location = /redoc        { proxy_pass http://robotuth_server; }
        location = /openapi.json { proxy_pass http://robotuth_server; }
        location = /health       { proxy_pass http://robotuth_server; }

        # --- Robot / app API (token enforced inside the app) ---
        location /api/ { proxy_pass http://robotuth_server; }
        location /asr/ { proxy_pass http://robotuth_server; }

        # --- Admin surface: LAN only. Replaces TailscaleWebGuardMiddleware, and
        #     closes the previously ungated /api/knowledge/* + /api/settings/*. ---
        location /static {
            allow 127.0.0.1;
            allow 172.16.1.0/24;
            deny all;
            proxy_pass http://robotuth_server;
        }
        location /api/knowledge {
            allow 127.0.0.1;
            allow 172.16.1.0/24;
            deny all;
            proxy_pass http://robotuth_server;
        }
        location /api/settings {
            allow 127.0.0.1;
            allow 172.16.1.0/24;
            deny all;
            proxy_pass http://robotuth_server;
        }

        # --- WebSockets: robot link, operator relay, streaming ASR ---
        location /ws/ {
            proxy_pass http://robotuth_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_request_buffering off;   # required for /ws/asr frame streaming
        }

        # One door: opening the root shows the API docs.
        location = / { return 302 /docs; }
        location /   { return 404; }
    }
}
