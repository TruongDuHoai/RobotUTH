<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phiếu phản ánh</title><style>body{font:14px Arial;margin:24px;background:#f6f8fa;color:#17212b}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border:1px solid #d8dee4;text-align:left;vertical-align:top}th{background:#e8f3f2}textarea,input,select{width:100%;box-sizing:border-box;padding:7px}button{padding:8px 12px;background:#006f72;color:#fff;border:0;border-radius:5px}#edit{margin:16px 0;padding:16px;background:#fff;border:1px solid #d8dee4}small{color:#57606a}</style><body><h1>Phiếu phản ánh</h1><p><a href="/static/index.html">Trang chủ</a> · <small>Bấm một dòng để xử lý.</small></p><div id="edit" hidden><b id="selected"></b><p><label>Câu trả lời xử lý<textarea id="answer"></textarea></label></p><p><label>Người xử lý<input id="handler"></label></p><p><label>Trạng thái<select id="status"><option>Mới</option><option>Đã tiếp nhận</option><option>Đang xử lý</option><option>Chờ bổ sung</option><option>Hoàn tất</option></select></label></p><p><label>Ghi chú trạng thái<textarea id="status_note"></textarea></label></p><button onclick="save()">Lưu xử lý</button></div><table><thead><tr><th>Ngày</th><th>MSSV/CCCD</th><th>Chi tiết vấn đề</th><th>Câu trả lời xử lý</th><th>Người xử lý</th><th>Ghi chú trạng thái</th><th>Ghi chú khác</th></tr></thead><tbody id="rows"></tbody></table><script src="/static/web/auth.js"></script><script>let chosen;const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function load(){const d=await fetch('/api/issues').then(r=>r.json());document.querySelector('#rows').innerHTML=d.issues.map((x,i)=>`<tr onclick="pick(${i})"><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.identity)}</td><td>${esc(x.detail)}</td><td>${esc(x.answer)}</td><td>${esc(x.handler)}</td><td>${esc(x.status)}<br>${esc(x.status_note)}</td><td>${esc(x.other_notes)}</td></tr>`).join('');window.items=d.issues}function pick(i){chosen=items[i];selected.textContent='Phiếu '+chosen.id;answer.value=chosen.answer;handler.value=chosen.handler;status.value=chosen.status;status_note.value=chosen.status_note;edit.hidden=false;scrollTo({top:0,behavior:'smooth'})}async function save(){const r=await fetch('/api/issues/'+chosen.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({answer:answer.value,handler:handler.value,status:status.value,status_note:status_note.value})});if(!r.ok)return alert(await r.text());edit.hidden=true;load()}load().catch(e=>document.body.insertAdjacentHTML('afterbegin','<p>Lỗi: '+esc(e)+'</p>'))</script></body></html>
